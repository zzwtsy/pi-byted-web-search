name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC 认证必需
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          registry-url: "https://registry.npmjs.org"

      - run: npm install -g npm@latest # OIDC 需要 npm >= 11.5.1

      - run: npm install

      - run: npm run check
      - run: npm run lint
      - run: npm test

      - run: npm publish
